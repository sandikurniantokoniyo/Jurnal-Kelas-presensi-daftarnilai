        const ViewNilai = () => {
            const { data, refreshData, showToast, askConfirm } = useContext(AppContext);
            const [selectedClass, setSelectedClass] = useState(data.classes[0]?.id || '');
            const [selectedSubject, setSelectedSubject] = useState(data.subjects[0] || '');
            const [searchKeyword, setSearchKeyword] = useState('');
            const [scoreRecords, setScoreRecords] = useState({});

            const [showCatModal, setShowCatModal] = useState(false);
            const [catForm, setCatForm] = useState({ id: '', name: '', type: 'Formatif' });

            const classStudents = useMemo(() => {
                return data.students.filter(s => {
                    const matchClass = s.classId === selectedClass;
                    const matchSearch = s.name.toLowerCase().includes(searchKeyword.toLowerCase()) || 
                                        s.nis.toLowerCase().includes(searchKeyword.toLowerCase());
                    return matchClass && matchSearch;
                });
            }, [data.students, selectedClass, searchKeyword]);

            const currentClassName = useMemo(() => {
                return data.classes.find(c => c.id === selectedClass)?.name || '';
            }, [data.classes, selectedClass]);

            useEffect(() => {
                const existing = data.grades.find(g => g.classId === selectedClass && g.subject === selectedSubject);
                if (existing) {
                    setScoreRecords(existing.records || {});
                } else {
                    setScoreRecords({});
                }
            }, [selectedClass, selectedSubject, data.grades]);

            const handleScoreChange = (studentId, catId, val) => {
                const numericVal = val === '' ? '' : Math.min(100, Math.max(0, Number(val)));
                setScoreRecords(prev => ({
                    ...prev,
                    [studentId]: {
                        ...(prev[studentId] || {}),
                        [catId]: numericVal
                    }
                }));
            };

            const handleSaveGrades = () => {
                DB.saveStudentGrades(selectedClass, selectedSubject, scoreRecords);
                refreshData();
                showToast("Daftar nilai murid berhasil disimpan!");
            };

            const handleSaveCategory = (e) => {
                e.preventDefault();
                if (!catForm.name.trim()) {
                    showToast("Nama komponen nilai wajib diisi!", "error");
                    return;
                }
                DB.saveGradeCategory({
                    id: catForm.id,
                    name: catForm.name.trim(),
                    type: catForm.type
                });
                refreshData();
                setShowCatModal(false);
                setCatForm({ id: '', name: '', type: 'Formatif' });
                showToast("Komponen penilaian berhasil ditambahkan!");
            };

            const handleDeleteCategory = (catId, catName) => {
                askConfirm({
                    title: "Hapus Komponen Nilai",
                    message: `Apakah Anda yakin ingin menghapus kolom "${catName}"? Seluruh nilai terkait kolom ini juga akan terhapus.`,
                    onConfirm: () => {
                        DB.deleteGradeCategory(catId);
                        refreshData();
                        showToast(`Kolom "${catName}" berhasil dihapus.`);
                    }
                });
            };

            const calculateStudentAvg = (studentId) => {
                const stScores = scoreRecords[studentId] || {};
                const validVals = Object.values(stScores).filter(v => v !== '' && v !== null && !isNaN(v));
                if (validVals.length === 0) return { avg: '-', pred: '-' };
                const sum = validVals.reduce((a, b) => Number(a) + Number(b), 0);
                const avg = Math.round((sum / validVals.length) * 10) / 10;
                
                let pred = 'D';
                if (avg >= 88) pred = 'A';
                else if (avg >= 78) pred = 'B';
                else if (avg >= 70) pred = 'C';

                return { avg, pred };
            };

            const exportGradesExcel = () => {
                if (classStudents.length === 0) {
                    showToast("Tidak ada siswa untuk diexport!", "error");
                    return;
                }

                const excelRows = classStudents.map((s, idx) => {
                    const row = {
                        "No": idx + 1,
                        "NIS": s.nis,
                        "Nama Siswa": s.name,
                        "L/P": s.gender,
                        "Kelas": s.className
                    };

                    data.gradeCategories.forEach(cat => {
                        const score = scoreRecords[s.id]?.[cat.id];
                        row[cat.name] = score !== undefined && score !== '' ? score : '-';
                    });

                    const { avg, pred } = calculateStudentAvg(s.id);
                    row["Rata-Rata"] = avg;
                    row["Predikat"] = pred;

                    return row;
                });

                const worksheet = XLSX.utils.json_to_sheet(excelRows);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, `Nilai_${currentClassName}`);
                XLSX.writeFile(workbook, `Daftar_Nilai_Kelas_${currentClassName}_${selectedSubject.replace(/[^a-zA-Z0-9]/g, '_')}.xlsx`);
                showToast("Daftar Nilai berhasil diexport ke Excel!");
            };

            const exportGradesPDF = () => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF('l', 'mm', 'a4');

                const kop = data.kopSettings;
                const teacher = data.teacher;

                if (kop.logoLeft) {
                    try { doc.addImage(kop.logoLeft, 'PNG', 14, 10, kop.logoSize || 20, kop.logoSize || 20); } catch(e){}
                }
                if (kop.logoRight) {
                    try { doc.addImage(kop.logoRight, 'PNG', 263, 10, kop.logoSize || 20, kop.logoSize || 20); } catch(e){}
                }

                doc.setFont("helvetica", "bold");
                doc.setFontSize(11);
                doc.text(kop.line1 || "", 148, 14, { align: "center" });
                doc.setFontSize(12);
                doc.text(kop.line2 || "", 148, 20, { align: "center" });
                doc.setFontSize(13);
                doc.text(kop.line3 || "", 148, 26, { align: "center" });
                
                doc.setFont("helvetica", "normal");
                doc.setFontSize(8);
                doc.text(kop.address || "", 148, 31, { align: "center" });
                doc.text(kop.contact || "", 148, 35, { align: "center" });

                doc.setLineWidth(0.8);
                doc.line(14, 38, 283, 38);
                doc.setLineWidth(0.2);
                doc.line(14, 39, 283, 39);

                doc.setFont("helvetica", "bold");
                doc.setFontSize(12);
                doc.text(`DAFTAR NILAI SISWA (FORMATIF, SUMATIF & PAS)`, 148, 46, { align: "center" });

                doc.setFontSize(9);
                doc.setFont("helvetica", "normal");
                doc.text(`Mata Pelajaran : ${selectedSubject}`, 14, 54);
                doc.text(`Kelas               : Kelas ${currentClassName}`, 14, 59);
                doc.text(`Tahun Pelajaran : ${teacher.academicYear}`, 200, 54);
                doc.text(`Guru Pengampu : ${teacher.name}`, 200, 59);

                const headCols = ['No', 'NIS', 'Nama Siswa', 'L/P'];
                data.gradeCategories.forEach(cat => headCols.push(cat.name));
                headCols.push('Rata-Rata', 'Predikat');

                const tableBody = classStudents.map((s, i) => {
                    const row = [i + 1, s.nis, s.name, s.gender];
                    data.gradeCategories.forEach(cat => {
                        const score = scoreRecords[s.id]?.[cat.id];
                        row.push(score !== undefined && score !== '' ? score : '-');
                    });
                    const { avg, pred } = calculateStudentAvg(s.id);
                    row.push(avg, pred);
                    return row;
                });

                doc.autoTable({
                    startY: 64,
                    head: [headCols],
                    body: tableBody,
                    styles: { fontSize: 8, cellPadding: 2, halign: 'center' },
                    headStyles: { fillColor: [197, 149, 53], textColor: 255, fontStyle: 'bold' },
                    columnStyles: {
                        0: { cellWidth: 10 },
                        1: { cellWidth: 22 },
                        2: { cellWidth: 'auto', halign: 'left' },
                        3: { cellWidth: 12 },
                    }
                });

                const finalY = doc.lastAutoTable.finalY + 12;
                if (finalY < 180) {
                    doc.text(`Gorontalo, ${formatDate(new Date().toISOString())}`, 200, finalY);
                    doc.text("Mengetahui,", 14, finalY + 4);
                    doc.text("Kepala Madrasah / Sekolah", 14, finalY + 8);
                    doc.text("Guru Mata Pelajaran", 200, finalY + 8);

                    doc.setFont("helvetica", "bold");
                    doc.text(teacher.headmasterName || "Kepala Sekolah", 14, finalY + 26);
                    doc.setFont("helvetica", "normal");
                    doc.text(`NIP. ${teacher.headmasterNip || '-'}`, 14, finalY + 30);

                    doc.setFont("helvetica", "bold");
                    doc.text(teacher.name, 200, finalY + 26);
                    doc.setFont("helvetica", "normal");
                    doc.text(`NIP. ${teacher.nip}`, 200, finalY + 30);
                }

                doc.save(`Daftar_Nilai_Kelas_${currentClassName}_${selectedSubject.replace(/[^a-zA-Z0-9]/g, '_')}.pdf`);
                showToast("Daftar Nilai PDF berhasil dicetak!");
            };

            return (
                <div className="animate-fade-in space-y-6">
                    <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div>
                            <h2 className="text-2xl font-bold font-display text-slate-800 dark:text-white flex items-center gap-2">
                                <i className="ph ph-chart-bar text-gold-500"></i>
                                Daftar Nilai Murid
                            </h2>
                            <p className="text-sm text-slate-500">Input nilai formatif, sumatif, PAS, tambah/kurang komponen nilai, & export file Excel/PDF.</p>
                        </div>

                        <div className="flex flex-wrap items-center gap-2">
                            <Button variant="emerald" icon="ph-file-xls" onClick={exportGradesExcel}>
                                Export Excel
                            </Button>
                            <Button variant="primary" icon="ph-file-pdf" onClick={exportGradesPDF}>
                                Export PDF
                            </Button>
                            <Button variant="secondary" icon="ph-plus-circle" onClick={() => { setCatForm({ id: '', name: '', type: 'Formatif' }); setShowCatModal(true); }}>
                                Tambah Kolom Nilai
                            </Button>
                        </div>
                    </div>

                    <Card className="!p-4">
                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 items-center">
                            <div>
                                <label className="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Pilih Kelas</label>
                                <select 
                                    value={selectedClass} 
                                    onChange={e => setSelectedClass(e.target.value)}
                                    className="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-darkcard text-sm font-medium outline-none"
                                >
                                    {data.classes.map(c => (
                                        <option key={c.id} value={c.id}>Kelas {c.name}</option>
                                    ))}
                                </select>
                            </div>

                            <div>
                                <label className="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Pilih Mata Pelajaran</label>
                                <select 
                                    value={selectedSubject} 
                                    onChange={e => setSelectedSubject(e.target.value)}
                                    className="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-darkcard text-sm font-medium outline-none"
                                >
                                    {data.subjects.map((s, idx) => (
                                        <option key={idx} value={s}>{s}</option>
                                    ))}
                                </select>
                            </div>

                            <div>
                                <label className="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Cari Nama / NIS</label>
                                <input 
                                    type="text" 
                                    placeholder="Kata kunci..." 
                                    value={searchKeyword} 
                                    onChange={e => setSearchKeyword(e.target.value)}
                                    className="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-darkcard text-sm outline-none"
                                />
                            </div>
                        </div>
                    </Card>

                    <Card className="!p-0 overflow-hidden">

                            <div className="text-slate-600 dark:text-slate-300 font-semibold">
                                Kelas: <strong className="text-gold-600">{currentClassName}</strong> | Mata Pelajaran: <strong>{selectedSubject}</strong> | Total Siswa: <strong>{classStudents.length}</strong>
                            </div>
                            <Button variant="emerald" icon="ph-floppy-disk" onClick={handleSaveGrades} className="!py-1.5 !text-xs">
                                Simpan Perubahan Nilai
                            </Button>
                        </div>

                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse text-xs">
                                <thead>
                                    <tr className="bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 font-bold uppercase border-b border-slate-200 dark:border-slate-800">
                                        <th className="py-3 px-3 min-w-[40px]">No</th>
                                        <th className="py-3 px-3 min-w-[80px]">NIS</th>
                                        <th className="py-3 px-3 min-w-[150px]">Nama Siswa</th>
                                        <th className="py-3 px-3 text-center min-w-[50px]">L/P</th>
                                        
                                        {data.gradeCategories.map(cat => (
                                            <th key={cat.id} className="py-3 px-2 text-center min-w-[90px] border-l border-slate-200 dark:border-slate-700">
                                                <div className="flex items-center justify-between gap-1">

                                                        <i className="ph ph-x-circle text-sm"></i>

                                        <th className="py-3 px-3 text-center min-w-[80px] bg-gold-50 dark:bg-gold-900/20 text-gold-800 dark:text-gold-300 border-l">Rata2</th>
                                        <th className="py-3 px-3 text-center min-w-[70px] bg-gold-50 dark:bg-gold-900/20 text-gold-800 dark:text-gold-300">Predikat</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                                    {classStudents.length > 0 ? (
                                        classStudents.map((s, idx) => {

                                            return (
                                                <tr key={s.id} className="hover:bg-slate-50/50 dark:hover:bg-slate-800/30">
                                                    <td className="py-2.5 px-3 text-slate-400">{idx + 1}</td>
                                                    <td className="py-2.5 px-3 font-mono">{s.nis}</td>
                                                    <td className="py-2.5 px-3 font-semibold text-slate-800 dark:text-white">{s.name}</td>
                                                    <td className="py-2.5 px-3 text-center">{s.gender}</td>
                                                    
                                                    {data.gradeCategories.map(cat => {
                                                        const currentVal = scoreRecords[s.id]?.[cat.id] !== undefined ? scoreRecords[s.id][cat.id] : '';
                                                        return (
                                                            <td key={cat.id} className="py-1 px-1 border-l border-slate-100 dark:border-slate-800">
                                                                <input 
                                                                    type="number" 
                                                                    min="0" 
                                                                    max="100" 
                                                                    value={currentVal} 
                                                                    onChange={e => handleScoreChange(s.id, cat.id, e.target.value)} 
                                                                    placeholder="0-100"
                                                                    className="w-full text-center py-1 px-1 rounded border border-slate-200 dark:border-slate-700 bg-white dark:bg-darkcard focus:ring-1 focus:ring-gold-500 text-xs font-semibold outline-none"
                                                                />
                                                            </td>
                                                        );
                                                    })}

                                                    <td className="py-2.5 px-3 text-center font-bold text-gold-600 bg-gold-50/30 dark:bg-gold-900/10 border-l">{avg}</td>
                                                    <td className="py-2.5 px-3 text-center font-bold bg-gold-50/30 dark:bg-gold-900/10">
                                                        <span className={`px-2 py-0.5 rounded text-xs ${pred === 'A' ? 'bg-emerald-100 text-emerald-800' : pred === 'B' ? 'bg-blue-100 text-blue-800' : 'bg-amber-100 text-amber-800'}`}>{pred}</span>
                                                    </td>
                                                </tr>
                                            );
                                        })
                                    ) : (
                                        <tr><td colSpan={5 + data.gradeCategories.length} className="py-8 text-center text-slate-400">Belum ada siswa di kelas ini.</td></tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </Card>

                    {showCatModal && (

        const ViewJurnalExport = () => {
            const { data, showToast } = useContext(AppContext);
            const [exportClass, setExportClass] = useState('ALL');
            const [exportMonth, setExportMonth] = useState(new Date().toISOString().substr(0, 7));

            const filteredJournals = useMemo(() => {
                return data.journals.filter(j => {
                    const matchClass = exportClass === 'ALL' || j.classId === exportClass;
                    const matchMonth = j.date.startsWith(exportMonth);
                    return matchClass && matchMonth;
                });
            }, [data.journals, exportClass, exportMonth]);

            const generatePDF = () => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF('p', 'mm', 'a4');
                const kop = data.kopSettings;
                const teacher = data.teacher;

                if (kop.logoLeft) {
                    try { doc.addImage(kop.logoLeft, 'PNG', 12, 10, kop.logoSize || 20, kop.logoSize || 20); } catch(e){}
                }
                if (kop.logoRight) {
                    try { doc.addImage(kop.logoRight, 'PNG', 178, 10, kop.logoSize || 20, kop.logoSize || 20); } catch(e){}
                }

                doc.setFont("helvetica", "bold");
                doc.setFontSize(11);
                doc.text(kop.line1 || "", 105, 15, { align: "center" });
                doc.setFontSize(12);
                doc.text(kop.line2 || "", 105, 21, { align: "center" });
                doc.setFontSize(13);
                doc.text(kop.line3 || "", 105, 27, { align: "center" });
                
                doc.setFont("helvetica", "normal");
                doc.setFontSize(8);
                doc.text(kop.address || "", 105, 32, { align: "center" });
                doc.text(kop.contact || "", 105, 36, { align: "center" });

                doc.setLineWidth(0.8);
                doc.line(12, 39, 198, 39);
                doc.setLineWidth(0.2);
                doc.line(12, 40, 198, 40);

                doc.setFont("helvetica", "bold");
                doc.setFontSize(12);
                doc.text(`JURNAL HARIAN MENGAJAR GURU`, 105, 48, { align: "center" });

                doc.setFontSize(9);
                doc.setFont("helvetica", "normal");
                doc.text(`Nama Guru    : ${teacher.name}`, 12, 56);
                doc.text(`NIP                 : ${teacher.nip}`, 12, 61);
                doc.text(`Bulan / Tahun : ${exportMonth}`, 135, 56);
                doc.text(`Fase              : Phase ${teacher.phase}`, 135, 61);

                const tableBody = filteredJournals.map((j, i) => [
                    i + 1,
                    j.date,
                    j.className,
                    j.subject,
                    j.jamKe,
                    j.material,
                    j.activities
                ]);

                doc.autoTable({
                    startY: 67,
                    head: [['No', 'Tanggal', 'Kelas', 'Matpel', 'Jam', 'Materi', 'Kegiatan']],
                    body: tableBody,
                    styles: { fontSize: 8, cellPadding: 2.5 },
                    headStyles: { fillColor: [197, 149, 53], textColor: 255, fontStyle: 'bold' }
                });

                const finalY = doc.lastAutoTable.finalY + 15;
                if (finalY < 250) {
                    doc.text(`Gorontalo, ${formatDate(new Date().toISOString())}`, 135, finalY);
                    doc.text("Mengetahui,", 12, finalY + 5);
                    doc.text("Kepala Madrasah / Sekolah", 12, finalY + 10);
                    doc.text("Guru Mata Pelajaran", 135, finalY + 10);

                    doc.setFont("helvetica", "bold");
                    doc.text(teacher.headmasterName || "Kepala Sekolah", 12, finalY + 30);
                    doc.setFont("helvetica", "normal");
                    doc.text(`NIP. ${teacher.headmasterNip || '-'}`, 12, finalY + 34);

                    doc.setFont("helvetica", "bold");
                    doc.text(teacher.name, 135, finalY + 30);
                    doc.setFont("helvetica", "normal");
                    doc.text(`NIP. ${teacher.nip}`, 135, finalY + 34);
                }

                doc.save(`Rekap_Jurnal_Harian_${exportMonth}.pdf`);
                showToast("Rekap Jurnal PDF berhasil diunduh!");
            };

            return (
                <div className="animate-fade-in space-y-6">
                    <div>
                        <h2 className="text-2xl font-bold font-display text-slate-800 dark:text-white flex items-center gap-2">
                            <i className="ph ph-printer text-gold-500"></i>
                            Export Jurnal Harian (PDF)

                    </div>

                            <Input label="Bulan & Tahun Jurnal" type="month" value={exportMonth} onChange={e => setExportMonth(e.target.value)} />

                            <p className="text-xs text-slate-500">Total jurnal siap cetak: <strong>{filteredJournals.length} item</strong></p>
                            <Button variant="primary" icon="ph-file-pdf" onClick={generatePDF} className="w-full">Unduh Rekap Jurnal PDF</Button>
                        </div>
                    </Card>
                </div>
            );

                                        max="35" 
                                        value={kop.logoSize || 20} 
                                        onChange={e => setKop({...kop, logoSize: Number(e.target.value)})}
                                        className="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-gold-500"
                                    />
                                </div>
                            </div>
                        </Card>

                        {/* Profile & Branding Application */}
                        <Card>
                            <h3 className="font-bold text-lg text-slate-800 dark:text-white mb-4 flex items-center gap-2">
                                <i className="ph ph-desktop text-gold-500"></i> Identitas Aplikasi & Tema Warna
                            </h3>

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <Input label="Judul Aplikasi" value={app.appTitle} onChange={e => setApp({...app, appTitle: e.target.value})} />
                                <Input label="Sub-Judul Aplikasi" value={app.appSubtitle} onChange={e => setApp({...app, appSubtitle: e.target.value})} />
                                <Input label="Awalan Salam Dashboard" value={app.greetingPrefix} onChange={e => setApp({...app, greetingPrefix: e.target.value})} />
                                <Input label="Teks Sapaan Utama" value={app.dashboardGreetingText} onChange={e => setApp({...app, dashboardGreetingText: e.target.value})} />
                            </div>

                            <div className="mt-4">
                                <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Tema Warna Utama Aplikasi</label>
                                <div className="flex flex-wrap gap-3">
                                    {[
                                        { id: 'gold', name: 'Emas / Gold', color: 'bg-amber-500' },
                                        { id: 'emerald', name: 'Hijau Emerald', color: 'bg-emerald-500' },
                                        { id: 'indigo', name: 'Biru Nila / Indigo', color: 'bg-indigo-500' },
                                        { id: 'rose', name: 'Merah Mawar / Rose', color: 'bg-rose-500' },
                                    ].map(t => (
                                        <button
                                            key={t.id}
                                            type="button"
                                            onClick={() => setApp({ ...app, themeColor: t.id })}
                                            className={`flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-bold border transition-all ${
                                                app.themeColor === t.id 
                                                    ? 'border-gold-500 bg-gold-50 dark:bg-gold-900/30 text-gold-700 dark:text-gold-300 shadow-sm ring-2 ring-gold-500' 
                                                    : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300'
                                            }`}
                                        >
                                            <span className={`w-3.5 h-3.5 rounded-full ${t.color}`}></span>
                                            {t.name}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </Card>

                        <div className="flex justify-end gap-3 sticky bottom-4 z-20">
                            <Button type="submit" variant="primary" icon="ph-floppy-disk" className="!px-8 !py-3 shadow-xl">
                                Simpan Semua Pengaturan Kop & Logo
                            </Button>
                        </div>
                    </form>
                </div>
            );
        };

        const ViewAccountSecurity = () => {
            const { data, refreshData, showToast } = useContext(AppContext);
            const [teacherForm, setTeacherForm] = useState(data.teacher);

            const handleSaveProfile = (e) => {
                e.preventDefault();
                DB.saveTeacher(teacherForm);
                refreshData();
                showToast("Profil Guru & Keamanan berhasil diperbarui!");
            };

            return (
                <div className="animate-fade-in space-y-6 max-w-2xl mx-auto">
                    <div>
                        <h2 className="text-2xl font-bold font-display text-slate-800 dark:text-white flex items-center gap-2">
                            <i className="ph ph-shield-check text-gold-500"></i>
                            Akun Guru & Keamanan
                        </h2>
                        <p className="text-sm text-slate-500">Atur profil guru, NIP, serta Kepala Sekolah untuk tanda tangan PDF.</p>
                    </div>

                    <Card>
                        <form onSubmit={handleSaveProfile} className="space-y-4">
                            <Input label="Nama Lengkap Guru (dengan Gelar)" value={teacherForm.name} onChange={e => setTeacherForm({...teacherForm, name: e.target.value})} required />
                            <Input label="NIP Guru" value={teacherForm.nip} onChange={e => setTeacherForm({...teacherForm, nip: e.target.value})} required />
                            <Input label="Nama Kepala Sekolah / Madrasah" value={teacherForm.headmasterName} onChange={e => setTeacherForm({...teacherForm, headmasterName: e.target.value})} required />
                            <Input label="NIP Kepala Sekolah" value={teacherForm.headmasterNip} onChange={e => setTeacherForm({...teacherForm, headmasterNip: e.target.value})} required />
                            
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <Input label="Fase Mengajar" value={teacherForm.phase} onChange={e => setTeacherForm({...teacherForm, phase: e.target.value})} />
                                <Input label="Tahun Pelajaran" value={teacherForm.academicYear} onChange={e => setTeacherForm({...teacherForm, academicYear: e.target.value})} />
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2 border-t">
                                <Input label="Username Login" value={teacherForm.username} onChange={e => setTeacherForm({...teacherForm, username: e.target.value})} />
                                <Input label="Password Login" type="password" value={teacherForm.password} onChange={e => setTeacherForm({...teacherForm, password: e.target.value})} />
                            </div>

                            <div className="flex justify-end pt-4">
                                <Button type="submit" variant="primary" icon="ph-floppy-disk">Simpan Profil & Akun</Button>
                            </div>
                        </form>
                    </Card>
                </div>
            );
        };

        const App = () => {
            const { currentView } = useContext(AppContext);
            const [sidebarOpen, setSidebarOpen] = useState(false);

            const renderView = () => {
                switch(currentView) {
                    case 'dashboard': return <ViewDashboard />;
                    case 'siswa': return <ViewSiswa />;
                    case 'kelas': return <ViewKelas />;
                    case 'presensi': return <ViewPresensi />;
                    case 'nilai': return <ViewNilai />;
                    case 'matpel': return <ViewMatpel />;
                    case 'jurnal_list': return <ViewJurnalList />;
                    case 'jurnal_form': return <ViewJurnalForm />;
                    case 'jurnal_export': return <ViewJurnalExport />;
                    case 'app_settings': return <ViewAppSettings />;
                    case 'account_security': return <ViewAccountSecurity />;
                    default: return <ViewDashboard />;
                }
            };

            return (
                <div className="min-h-screen flex flex-col lg:flex-row">
                    <Sidebar isOpen={sidebarOpen} setIsOpen={setSidebarOpen} />
                    
                    <div className="flex-1 lg:pl-64 flex flex-col min-h-screen">
                        <Header toggleSidebar={() => setSidebarOpen(!sidebarOpen)} />
                        
                        <main className="flex-1 p-4 lg:p-8 max-w-7xl w-full mx-auto">
                            {renderView()}
                        </main>

                        <footer className="py-4 text-center text-xs text-slate-400 border-t border-slate-200 dark:border-slate-800 mt-8">
                            &copy; {new Date().getFullYear()} JELAS - Jurnal Harian Guru, Presensi & Daftar Nilai. All rights reserved.
                        </footer>
                    </div>
                </div>
            );
        };

        const RootApp = () => (
            <AppProvider>
                <App />
            </AppProvider>
        );

        ReactDOM.createRoot(document.getElementById('root')).render(<RootApp />);
    </script>
</body>
</html>
