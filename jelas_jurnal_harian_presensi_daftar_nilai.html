        const { useState, useEffect, useMemo, createContext, useContext, useRef } = React;

        // Image compression helper to avoid localStorage QuotaExceededError
        const compressImage = (file, maxWidth = 300, maxHeight = 300, quality = 0.85) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > maxWidth) {
                                height = Math.round((height * maxWidth) / width);
                                width = maxWidth;
                            }
                        } else {
                            if (height > maxHeight) {
                                width = Math.round((width * maxHeight) / height);
                                height = maxHeight;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/png', quality));
                    };
                    img.onerror = (err) => reject(err);
                    img.src = e.target.result;
                };
                reader.onerror = (err) => reject(err);
                reader.readAsDataURL(file);
            });
        };

        const defaultKopSettings = {

            line3: "MADRASAH TSANAWIYAH NEGERI 2 KABUPATEN GORONTALO",
            address: "Jl. Ahmad A. Wahab No. 123, Limboto, Kab. Gorontalo",

        const initialData = {
            appSettings: {

                appSubtitle: "JURNAL GURU FASE D",
                schoolName: "MTs Negeri 2 Kabupaten Gorontalo",

                welcomeText: "Selamat datang di Dashboard Jurnal Harian & Penilaian Guru. Semoga hari mengajar Anda menyenangkan!",
                themeColor: "gold",
                appLogo: "",

            kopSettings: defaultKopSettings,
            teacher: {
                name: "Sandi Kurnianto Koniyo, S.Pd",
                nip: "19850101 201001 1 001",
                username: "sandikurnianto",
                password: "password123",
                school: "MTs Negeri 2 Kabupaten Gorontalo",
                phase: "D",
                academicYear: "2026/2027",
                photo: "https://placehold.co/150x150/c59535/ffffff?text=SK",
                headmasterName: "Drs. H. Abd. Rahman, M.Pd",
                headmasterNip: "19710515 199703 1 002"
            },
            classes: [
                { id: 'c1', name: 'VII-A' },
                { id: 'c2', name: 'VII-B' },
                { id: 'c3', name: 'VII-C' },
                { id: 'c4', name: 'VII-D' },
                { id: 'c5', name: 'VII-E' },
                { id: 'c6', name: 'VII-F' },
                { id: 'c7', name: 'VII-G' },
            ],
            subjects: [
                "Bahasa Indonesia", "Matematika", "IPA", "IPS", "Bahasa Inggris", 
                "Pendidikan Agama Islam", "Al-Qur'an Hadits", "Akidah Akhlak", "Fikih", 
                "Sejarah Kebudayaan Islam (SKI)", "Bahasa Arab", "Informatika", "PJOK", "Pancasila / PPKn"
            ],
            students: [],
            journals: [
                {
                    id: 'j_sample1',
                    date: new Date().toISOString().split('T')[0],
                    classId: 'c1',
                    className: 'VII-A',
                    subject: 'Bahasa Indonesia',
                    jamKe: 'Jam Ke 1 - 2 (07:30 - 09:00)',
                    material: 'Menelaah Teks Deskripsi',
                    activities: 'Siswa membaca contoh teks deskripsi dan mengidentifikasi struktur isi teks.',
                    notes: 'Seluruh siswa aktif berkontribusi.'
                }
            ],
            attendance: [],
            gradeCategories: [
                { id: 'cat_f1', name: 'Formatif 1', type: 'Formatif' },
                { id: 'cat_f2', name: 'Formatif 2', type: 'Formatif' },
                { id: 'cat_s1', name: 'Sumatif 1 (LM)', type: 'Sumatif' },
                { id: 'cat_s2', name: 'Sumatif 2 (LM)', type: 'Sumatif' },
                { id: 'cat_pas', name: 'Sumatif PAS / PAT', type: 'PAS' },
            ],
            grades: []
        };

        const generateStudents = () => {
            let students = [];
            let idCounter = 1;
            initialData.classes.forEach(cls => {
                for(let i = 1; i <= 6; i++) {
                    students.push({
                        id: `s_${idCounter}`,
                        nis: `2026${String(idCounter).padStart(3, '0')}`,
                        name: `Siswa ${cls.name} #${i}`,
                        gender: i % 2 === 0 ? 'L' : 'P',
                        classId: cls.id,
                        className: cls.name
                    });
                    idCounter++;
                }
            });
            return students;
        };
        initialData.students = generateStudents();

        const DB = {
            init: () => {
                if (!localStorage.getItem('jelas_data_v6')) {
                    localStorage.setItem('jelas_data_v6', JSON.stringify(initialData));
                }
            },
            get: () => {
                try {
                    const raw = localStorage.getItem('jelas_data_v6');
                    const data = raw ? JSON.parse(raw) : initialData;
                    if (!data.subjects) data.subjects = initialData.subjects;
                    if (!data.attendance) data.attendance = [];
                    if (!data.classes) data.classes = initialData.classes;
                    if (!data.kopSettings) data.kopSettings = initialData.kopSettings;
                    if (!data.teacher) data.teacher = initialData.teacher;
                    if (!data.appSettings) data.appSettings = initialData.appSettings;
                    if (!data.gradeCategories) data.gradeCategories = initialData.gradeCategories;
                    if (!data.grades) data.grades = [];
                    return data;
                } catch(e) {
                    console.error("DB parse error", e);
                    return initialData;
                }
            },
            set: (data) => {
                try {
                    localStorage.setItem('jelas_data_v6', JSON.stringify(data));
                } catch(err) {
                    console.error("LocalStorage save error", err);
                    alert("Gagal menyimpan data ke browser storage! Ukuran file mungkin terlalu besar.");
                }
            },
            
            saveJournal: (journal) => {
                const data = DB.get();
                if (journal.id) {
                    const idx = data.journals.findIndex(j => j.id === journal.id);
                    if (idx !== -1) data.journals[idx] = journal;
                } else {
                    journal.id = 'j_' + Date.now();
                    data.journals.unshift(journal);
                }
                DB.set(data);
            },
            deleteJournal: (id) => {
                const data = DB.get();
                data.journals = data.journals.filter(j => j.id !== id);
                DB.set(data);
            },

            saveClass: (cls) => {
                const data = DB.get();
                if (cls.id) {
                    const idx = data.classes.findIndex(c => c.id === cls.id);
                    if (idx !== -1) {
                        data.classes[idx] = cls;
                        data.students.forEach(s => {
                            if (s.classId === cls.id) s.className = cls.name;
                        });
                    }
                } else {
                    cls.id = 'c_' + Date.now();
                    data.classes.push(cls);
                }
                DB.set(data);
            },
            deleteClass: (id) => {
                const data = DB.get();
                data.classes = data.classes.filter(c => c.id !== id);
                data.students = data.students.filter(s => s.classId !== id);
                DB.set(data);
            },
            
            saveStudent: (student) => {
                const data = DB.get();
                if (student.id) {
                    const idx = data.students.findIndex(s => s.id === student.id);
                    if (idx !== -1) data.students[idx] = student;
                } else {
                    student.id = 's_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
                    data.students.push(student);
                }
                DB.set(data);
            },
            batchImportStudents: (newStudentsList, replaceClassId = null) => {
                const data = DB.get();
                if (replaceClassId) {
                    data.students = data.students.filter(s => s.classId !== replaceClassId);
                }
                newStudentsList.forEach(st => {
                    if (!st.id) st.id = 's_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
                    data.students.push(st);
                });
                DB.set(data);
            },
            deleteStudent: (id) => {
                const data = DB.get();
                data.students = data.students.filter(s => s.id !== id);
                DB.set(data);
            },

            saveAttendance: (date, classId, subject, records) => {
                const data = DB.get();
                const existingIdx = data.attendance.findIndex(a => a.date === date && a.classId === classId && (a.subject === subject || (!a.subject && !subject)));
                if (existingIdx !== -1) {
                    data.attendance[existingIdx].records = records;
                    data.attendance[existingIdx].subject = subject;
                } else {
                    data.attendance.push({
                        id: 'att_' + Date.now(),
                        date,
                        classId,
                        subject: subject || '',
                        records
                    });
                }
                DB.set(data);
            },

            saveGradeCategory: (cat) => {
                const data = DB.get();
                if (cat.id) {
                    const idx = data.gradeCategories.findIndex(c => c.id === cat.id);
                    if (idx !== -1) data.gradeCategories[idx] = cat;
                } else {
                    cat.id = 'cat_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
                    data.gradeCategories.push(cat);
                }
                DB.set(data);
            },
            deleteGradeCategory: (catId) => {
                const data = DB.get();
                data.gradeCategories = data.gradeCategories.filter(c => c.id !== catId);
                data.grades.forEach(g => {
                    Object.keys(g.records || {}).forEach(stId => {
                        if (g.records[stId] && g.records[stId][catId] !== undefined) {
                            delete g.records[stId][catId];
                        }
                    });
                });
                DB.set(data);
            },
            saveStudentGrades: (classId, subject, records) => {
                const data = DB.get();
                const idx = data.grades.findIndex(g => g.classId === classId && g.subject === subject);
                if (idx !== -1) {
                    data.grades[idx].records = records;
                } else {
                    data.grades.push({
                        id: 'grd_' + Date.now(),
                        classId,
                        subject,
                        records
                    });
                }
                DB.set(data);
            },

            saveSubject: (subjectName) => {
                const data = DB.get();
                if (!data.subjects.includes(subjectName)) {
                    data.subjects.push(subjectName);
                    DB.set(data);
                }
            },
            deleteSubject: (subjectName) => {
                const data = DB.get();
                data.subjects = data.subjects.filter(s => s !== subjectName);
                DB.set(data);
            },

            saveAppSettings: (settings) => {
                const data = DB.get();
                data.appSettings = { ...data.appSettings, ...settings };
                DB.set(data);
            },
            saveKopSettings: (kop) => {
                const data = DB.get();
                data.kopSettings = { ...data.kopSettings, ...kop };
                DB.set(data);
            },
            saveTeacher: (teacherData) => {
                const data = DB.get();
                data.teacher = { ...data.teacher, ...teacherData };
                DB.set(data);
            }
        };
        DB.init();

        const formatDate = (dateStr) => {
            if (!dateStr) return '';
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            return new Date(dateStr).toLocaleDateString('id-ID', options);
        };

        const AppProvider = ({ children }) => {
            const [data, setData] = useState(() => DB.get());
            const [user, setUser] = useState({ name: data.teacher?.name || 'Guru' });

            const [currentView, setCurrentView] = useState('dashboard');
            const [toast, setToast] = useState(null);
            const [confirmModal, setConfirmModal] = useState(null);

            useEffect(() => {
                document.documentElement.className = theme;
                localStorage.setItem('theme', theme);
            }, [theme]);

            useEffect(() => {
                const activeColor = data.appSettings?.themeColor || 'gold';
                document.documentElement.setAttribute('data-theme-color', activeColor);
            }, [data.appSettings?.themeColor]);

            const refreshData = () => setData(DB.get());

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3500);
            };

            const askConfirm = ({ title, message, onConfirm }) => {
                setConfirmModal({ title, message, onConfirm });
            };

            const closeConfirm = () => setConfirmModal(null);
            const toggleTheme = () => setTheme(prev => prev === 'light' ? 'dark' : 'light');

            return (
                <AppContext.Provider value={{ 
                    data, refreshData, 
                    user, setUser, 
                    theme, toggleTheme,
                    currentView, setCurrentView,
                    showToast, askConfirm
                }}>
                    {children}
                    
                    {toast && (
                        <div className={`fixed bottom-5 right-5 px-6 py-3.5 rounded-xl shadow-xl text-white font-medium z-50 animate-fade-in flex items-center gap-3 ${toast.type === 'success' ? 'bg-emerald-600' : 'bg-red-600'}`}>
                            <i className={`ph-fill ${toast.type === 'success' ? 'ph-check-circle' : 'ph-warning-circle'} text-2xl`}></i>
                            <span>{toast.message}</span>
                        </div>
                    )}

                    {confirmModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fade-in">
                            <div className="bg-white dark:bg-darkcard rounded-2xl p-6 max-w-sm w-full shadow-2xl border border-slate-200 dark:border-slate-800">

                                    <i className="ph ph-warning-diamond text-2xl"></i>
                                </div>
                                <h3 className="text-lg font-bold text-slate-800 dark:text-white mb-2">{confirmModal.title || 'Konfirmasi'}</h3>
                                <p className="text-sm text-slate-600 dark:text-slate-300 mb-6">{confirmModal.message}</p>
                                <div className="flex gap-3 justify-end">
                                    <button 
                                        type="button" 
                                        onClick={closeConfirm}
                                        className="px-4 py-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 font-medium text-sm"
                                    >
                                        Batal
                                    </button>
                                    <button 
                                        type="button" 
                                        onClick={() => {
                                            confirmModal.onConfirm();
                                            closeConfirm();
                                        }}
                                        className="px-4 py-2 rounded-lg bg-red-600 hover:bg-red-700 text-white font-medium text-sm shadow-md"
                                    >
                                        Ya, Lanjutkan
                                    </button>
                                </div>
                            </div>

                    )}

            <div onClick={onClick} className={`bg-white dark:bg-darkcard rounded-xl shadow-sm border border-slate-100 dark:border-slate-800 p-6 ${className}`}>

            const variants = {
                primary: "bg-gold-500 hover:bg-gold-600 text-white shadow-md shadow-gold-500/20 focus:ring-gold-500",
                secondary: "bg-slate-100 hover:bg-slate-200 text-slate-700 dark:bg-slate-800 dark:hover:bg-slate-700 dark:text-slate-200 focus:ring-slate-500",
                danger: "bg-red-50 hover:bg-red-100 text-red-600 dark:bg-red-900/20 dark:hover:bg-red-900/40 dark:text-red-400 focus:ring-red-500",

                ghost: "hover:bg-slate-100 text-slate-600 dark:hover:bg-slate-800 dark:text-slate-300"

            return (
                <button type={type} onClick={onClick} className={`${baseStyle} ${variants[variant]} ${className}`}>

                    { id: 'kelas', label: 'Data Kelas', icon: 'ph-blackboard' },
                    { id: 'presensi', label: 'Presensi Murid & Rekap', icon: 'ph-checks' },
                    { id: 'nilai', label: 'Daftar Nilai Murid', icon: 'ph-chart-bar' },
                    { id: 'matpel', label: 'Kelola Mata Pelajaran', icon: 'ph-book-bookmark' },
                ]},
                { title: 'JURNAL HARIAN', items: [
                    { id: 'jurnal_list', label: 'Semua Jurnal', icon: 'ph-book-open-text' },
                    { id: 'jurnal_form', label: 'Tambah Jurnal', icon: 'ph-plus-circle' },
                    { id: 'jurnal_export', label: 'Export & Rekap PDF', icon: 'ph-printer' },
                ]},
                { title: 'PENGATURAN', items: [
                    { id: 'app_settings', label: 'Pengaturan & Kop Logo', icon: 'ph-gear' },
                    { id: 'account_security', label: 'Akun & Keamanan', icon: 'ph-shield-check' },
                ]}
            ];

            const navItemClass = (id) => `flex items-center gap-3 px-4 py-3 rounded-xl cursor-pointer transition-colors mb-1 ${currentView === id ? 'bg-gold-500 text-white shadow-md shadow-gold-500/20 font-semibold' : 'text-slate-600 hover:bg-gold-50 dark:text-slate-400 dark:hover:bg-slate-800 hover:text-gold-600 dark:hover:text-gold-400'}`;

            return (
                <>
                    {isOpen && <div className="fixed inset-0 bg-black/50 z-40 lg:hidden" onClick={() => setIsOpen(false)}></div>}
                    
                    <aside className={`fixed inset-y-0 left-0 z-50 w-64 bg-white dark:bg-darkcard border-r border-slate-200 dark:border-slate-800 transform transition-transform duration-300 ease-in-out lg:translate-x-0 overflow-y-auto ${isOpen ? 'translate-x-0' : '-translate-x-full'}`}>
                        <div className="p-6 pb-4 border-b border-slate-100 dark:border-slate-800 sticky top-0 bg-white dark:bg-darkcard z-10">
                            <div className="flex items-center gap-3">
                                {data.appSettings?.appLogo ? (
                                    <img src={data.appSettings.appLogo} alt="Logo Web App" className="w-10 h-10 rounded-xl object-contain bg-white p-1 border shadow-sm" />
                                ) : (
                                    <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-gold-400 to-gold-600 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-gold-500/30">
                                        {data.appSettings?.appTitle?.charAt(0) || 'J'}
                                    </div>
                                )}
                                <div>
                                    <h1 className="font-display font-bold text-xl tracking-tight text-slate-800 dark:text-white">{data.appSettings?.appTitle || 'JELAS'}</h1>
                                    <p className="text-[10px] text-slate-500 font-medium tracking-wide">{data.appSettings?.appSubtitle || 'JURNAL GURU FASE D'}</p>
                                </div>
                            </div>
                        </div>

                        <div className="p-4">
                            {menus.map((section, idx) => (
                                <div key={idx} className="mb-5">
                                    <p className="px-4 text-[11px] font-bold text-slate-400 dark:text-slate-500 mb-2 uppercase tracking-wider">{section.title}</p>
                                    {section.items.map(item => (
                                        <div 
                                            key={item.id} 
                                            className={navItemClass(item.id)}
                                            onClick={() => { setCurrentView(item.id); setIsOpen(false); }}
                                        >
                                            <i className={`ph ${item.icon} text-xl ${currentView === item.id ? '' : 'text-slate-400'}`}></i>
                                            <span className="text-sm">{item.label}</span>
                                        </div>
                                    ))}
                                </div>
                            ))}
                        </div>
                    </aside>
                </>
            );
        };

        const Header = ({ toggleSidebar }) => {
            const { data, theme, toggleTheme } = useContext(AppContext);
            const today = formatDate(new Date().toISOString());
            const displayLogo = data.appSettings?.appLogo || data.teacher.photo;

            return (
                <header className="sticky top-0 z-30 bg-white/80 dark:bg-darkcard/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 h-16 flex items-center justify-between px-4 lg:px-8">
                    <div className="flex items-center gap-3 md:gap-4">
                        <button onClick={toggleSidebar} className="lg:hidden p-2 rounded-lg text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800">
                            <i className="ph ph-list text-2xl"></i>
                        </button>
                        <div className="flex items-center gap-2 text-xs md:text-sm text-slate-600 dark:text-slate-300 font-medium">
                            <i className="ph ph-calendar-blank text-gold-500 text-base"></i>
                            <span className="truncate">{today}</span>
                        </div>
                    </div>

                    <div className="flex items-center gap-3 md:gap-4">
                        <button onClick={toggleTheme} className="p-2 rounded-full text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800 transition-colors">
                            <i className={`ph ${theme === 'dark' ? 'ph-sun text-yellow-400' : 'ph-moon'} text-xl`}></i>
                        </button>
                        
                        <div className="flex items-center gap-3 pl-3 border-l border-slate-200 dark:border-slate-700">
                            <div className="hidden sm:block text-right">
                                <p className="text-xs md:text-sm font-semibold text-slate-800 dark:text-white leading-tight">{data.teacher.name.split(',')[0]}</p>
                                <p className="text-[11px] text-slate-500">Guru Phase {data.teacher.phase}</p>
                            </div>
                            <img src={displayLogo} alt="Profile / App Logo" className="w-8 h-8 rounded-full object-cover border-2 border-gold-400" />
                        </div>
                    </div>
                </header>
            );
        };

        const ViewDashboard = () => {
            const { data, setCurrentView } = useContext(AppContext);
            
            const stats = [
                { label: 'Total Siswa Terdaftar', value: data.students.length, icon: 'ph-users-three', color: 'bg-emerald-500', link: 'siswa' },
                { label: 'Kelas Aktif', value: data.classes.length, icon: 'ph-chalkboard-teacher', color: 'bg-blue-500', link: 'kelas' },
                { label: 'Total Jurnal Terisi', value: data.journals.length, icon: 'ph-books', color: 'bg-gold-500', link: 'jurnal_list' },
                { label: 'Daftar Nilai Input', value: data.grades.length, icon: 'ph-chart-bar', color: 'bg-indigo-500', link: 'nilai' },
            ];

            return (
                <div className="animate-fade-in space-y-6">
                    <div className="bg-gradient-to-r from-gold-600 to-gold-400 rounded-2xl p-6 md:p-8 text-white shadow-xl shadow-gold-500/20 relative overflow-hidden">
                        <div className="relative z-10 max-w-2xl">
                            <h2 className="text-2xl md:text-3xl font-display font-bold mb-2">
                                {data.appSettings?.greetingPrefix}, {data.appSettings?.dashboardGreetingText} 👋
                            </h2>
                            <p className="text-gold-50 text-sm md:text-base opacity-90">{data.appSettings?.welcomeText}</p>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
                        {stats.map((stat, idx) => (
                            <Card key={idx} className="flex items-center gap-4 hover:-translate-y-1 transition-transform cursor-pointer" onClick={() => setCurrentView(stat.link)}>
                                <div className={`w-12 h-12 rounded-2xl ${stat.color} text-white flex items-center justify-center flex-shrink-0 shadow-md`}>
                                    <i className={`ph ${stat.icon} text-2xl`}></i>
                                </div>
                                <div>
                                    <p className="text-xs text-slate-500 dark:text-slate-400 font-medium">{stat.label}</p>
                                    <h3 className="text-xl font-bold text-slate-800 dark:text-white">{stat.value}</h3>
                                </div>
                            </Card>
                        ))}
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <Card className="border-l-4 border-l-gold-500">
                            <div className="flex flex-col justify-between h-full">
                                <div>
                                    <h3 className="font-bold text-lg text-slate-800 dark:text-white flex items-center gap-2 mb-2">
                                        <i className="ph ph-plus-circle text-gold-500 text-2xl"></i>
                                        Isi Jurnal Mengajar Hari Ini
                                    </h3>
                                    <p className="text-sm text-slate-600 dark:text-slate-300">
                                        Lakukan pencatatan jurnal harian mengajar beserta jam pelajaran dan materi KBM.
                                    </p>
                                </div>
                                <div className="mt-4">
                                    <Button variant="primary" icon="ph-pencil-line" onClick={() => setCurrentView('jurnal_form')}>
                                        Tambah Jurnal Harian
                                    </Button>
                                </div>
                            </div>
                        </Card>

                        <Card className="border-l-4 border-l-emerald-500">
                            <div className="flex flex-col justify-between h-full">
                                <div>
                                    <h3 className="font-bold text-lg text-slate-800 dark:text-white flex items-center gap-2 mb-2">
                                        <i className="ph ph-checks text-emerald-600 text-2xl"></i>
                                        Presensi Murid & Rekap
                                    </h3>
                                    <p className="text-sm text-slate-600 dark:text-slate-300">
                                        Isi status kehadiran siswa per mata pelajaran serta unduh rekap harian atau bulanan.
                                    </p>
                                </div>
                                <div className="mt-4">
                                    <Button variant="emerald" icon="ph-user-check" onClick={() => setCurrentView('presensi')}>
                                        Buka Presensi
                                    </Button>
                                </div>
                            </div>
                        </Card>

                        <Card className="border-l-4 border-l-indigo-500">
                            <div className="flex flex-col justify-between h-full">
                                <div>
                                    <h3 className="font-bold text-lg text-slate-800 dark:text-white flex items-center gap-2 mb-2">
                                        <i className="ph ph-chart-bar text-indigo-600 text-2xl"></i>
                                        Daftar Nilai Murid
                                    </h3>
                                    <p className="text-sm text-slate-600 dark:text-slate-300">
                                        Input nilai Formatif, Sumatif PAS, tambah/kurang komponen nilai, serta export Excel/PDF.
                                    </p>
                                </div>
                                <div className="mt-4">
                                    <Button variant="secondary" icon="ph-exam" onClick={() => setCurrentView('nilai')}>
                                        Kelola Daftar Nilai
                                    </Button>
                                </div>
                            </div>
                        </Card>
                    </div>
                </div>
            );
        };

        const ViewSiswa = () => {
            const { data, refreshData, showToast, askConfirm } = useContext(AppContext);
            const [selectedClassFilter, setSelectedClassFilter] = useState('ALL');
            const [searchTerm, setSearchTerm] = useState('');
            const [showAddModal, setShowAddModal] = useState(false);
            const [showImportModal, setShowImportModal] = useState(false);
            
            const [importPreview, setImportPreview] = useState([]);
            const [importClassOption, setImportClassOption] = useState('AUTO');
            const [overwriteOption, setOverwriteOption] = useState(false);
            const fileInputRef = useRef(null);

            const [studentForm, setStudentForm] = useState({
                id: '',
                nis: '',
                name: '',
                gender: 'L',
                classId: data.classes[0]?.id || 'c1'
            });

            const filteredStudents = useMemo(() => {
                return data.students.filter(s => {
                    const matchClass = selectedClassFilter === 'ALL' || s.classId === selectedClassFilter;
                    const matchSearch = s.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                                        s.nis.toLowerCase().includes(searchTerm.toLowerCase());
                    return matchClass && matchSearch;
                });
            }, [data.students, selectedClassFilter, searchTerm]);

            const handleSaveStudent = (e) => {
                e.preventDefault();
                if (!studentForm.name || !studentForm.nis) {
                    showToast("Harap isi NIS dan Nama Siswa!", "error");
                    return;
                }
                const targetClass = data.classes.find(c => c.id === studentForm.classId);
                const payload = {
                    ...studentForm,
                    className: targetClass ? targetClass.name : 'VII-A'
                };
                DB.saveStudent(payload);
                refreshData();
                setShowAddModal(false);
                showToast("Data siswa berhasil disimpan!");
            };

            const handleDeleteStudent = (id, name) => {
                askConfirm({
                    title: "Hapus Data Siswa",
                    message: `Apakah Anda yakin ingin menghapus data siswa "${name}"?`,
                    onConfirm: () => {
                        DB.deleteStudent(id);
                        refreshData();
                        showToast("Data siswa berhasil dihapus.");
                    }
                });
            };

            const handleExcelFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const buffer = evt.target.result;
                        const workbook = XLSX.read(buffer, { type: 'array' });
                        const firstSheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[firstSheetName];
                        const jsonRows = XLSX.utils.sheet_to_json(worksheet, { defval: "" });

                        if (!jsonRows || jsonRows.length === 0) {
                            showToast("File Excel kosong atau format tidak terbaca!", "error");
                            return;
                        }

                        const parsed = jsonRows.map((row, idx) => {
                            const getVal = (possibleKeys) => {
                                for (let k of possibleKeys) {
                                    const foundKey = Object.keys(row).find(rk => rk.trim().toLowerCase() === k.toLowerCase());
                                    if (foundKey && row[foundKey] !== undefined) return String(row[foundKey]).trim();
                                }
                                return "";
                            };

                            const nis = getVal(['nis', 'nisn', 'no induk', 'nomor induk', 'nis/nisn', 'id']);
                            const name = getVal(['nama', 'nama siswa', 'nama lengkap', 'siswa']);
                            const jkRaw = getVal(['jenis kelamin', 'jk', 'gender', 'l/p']);
                            const className = getVal(['kelas', 'class', 'rombel', 'nama kelas']);

                            let gender = 'L';
                            if (jkRaw.toUpperCase().startsWith('P') || jkRaw.toLowerCase().includes('perempuan')) {
                                gender = 'P';
                            }

                            return {
                                id: 'imp_' + Date.now() + '_' + idx,
                                nis: nis || `2026${String(idx + 1).padStart(3, '0')}`,
                                name: name || `Siswa ${idx + 1}`,
                                gender: gender,
                                className: className || (selectedClassFilter !== 'ALL' ? data.classes.find(c => c.id === selectedClassFilter)?.name : 'VII-A'),
                                rawClassName: className
                            };
                        }).filter(item => item.name && item.name.length > 0);

                        setImportPreview(parsed);
                        setShowImportModal(true);
                    } catch (err) {
                        showToast("Gagal membaca file Excel. Pastikan format file valid.", "error");
                    }
                };
                reader.readAsArrayBuffer(file);
                e.target.value = null;
            };

            const handleConfirmImport = () => {
                if (importPreview.length === 0) return;

                const finalStudents = importPreview.map(st => {
                    let targetClassId = selectedClassFilter !== 'ALL' ? selectedClassFilter : data.classes[0]?.id;
                    let targetClassName = data.classes.find(c => c.id === targetClassId)?.name || 'VII-A';

                    if (importClassOption === 'AUTO' && st.rawClassName) {
                        const matchedClass = data.classes.find(c => c.name.toLowerCase().trim() === st.rawClassName.toLowerCase().trim());
                        if (matchedClass) {
                            targetClassId = matchedClass.id;
                            targetClassName = matchedClass.name;
                        }
                    } else if (importClassOption !== 'AUTO') {
                        targetClassId = importClassOption;
                        targetClassName = data.classes.find(c => c.id === importClassOption)?.name || 'VII-A';
                    }

                    return {
                        id: st.id,
                        nis: st.nis,
                        name: st.name,
                        gender: st.gender,
                        classId: targetClassId,
                        className: targetClassName
                    };
                });

                const replaceClass = overwriteOption ? (importClassOption !== 'AUTO' ? importClassOption : (selectedClassFilter !== 'ALL' ? selectedClassFilter : null)) : null;

                DB.batchImportStudents(finalStudents, replaceClass);
                refreshData();
                setShowImportModal(false);
                setImportPreview([]);
                showToast(`Berhasil mengimpor ${finalStudents.length} data siswa dari Excel!`);
            };

            const downloadTemplateExcel = () => {
                const templateData = [
                    { "NIS": "2026001", "Nama Siswa": "Ahmad Dani", "Jenis Kelamin": "L", "Kelas": "VII-A" },
                    { "NIS": "2026002", "Nama Siswa": "Siti Aminah", "Jenis Kelamin": "P", "Kelas": "VII-A" },
                ];
                const worksheet = XLSX.utils.json_to_sheet(templateData);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "Data Siswa");
                XLSX.writeFile(workbook, "Template_Import_Siswa_JELAS.xlsx");
            };

            return (
                <div className="animate-fade-in space-y-6">
                    <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div>
                            <h2 className="text-2xl font-bold font-display text-slate-800 dark:text-white flex items-center gap-2">
                                <i className="ph ph-users text-gold-500"></i>
                                Data Siswa & Import Excel
                            </h2>
                            <p className="text-sm text-slate-500">Kelola siswa, impor data Excel, atau unduh template format.</p>
                        </div>

                        <div className="flex flex-wrap items-center gap-2">
                            <input type="file" ref={fileInputRef} onChange={handleExcelFileUpload} accept=".xlsx, .xls, .csv" className="hidden" />
                            <Button variant="emerald" icon="ph-file-xls" onClick={() => fileInputRef.current.click()}>Import Excel</Button>
                            <Button variant="secondary" icon="ph-download-simple" onClick={downloadTemplateExcel}>Unduh Template</Button>
                            <Button variant="primary" icon="ph-plus" onClick={() => { setStudentForm({ id: '', nis: '', name: '', gender: 'L', classId: data.classes[0]?.id }); setShowAddModal(true); }}>Manual</Button>
                        </div>
                    </div>

                    <Card className="!p-4">
                        <div className="flex flex-col md:flex-row items-center justify-between gap-4">
                            <div className="flex flex-wrap items-center gap-3 w-full md:w-auto">
                                <select 
                                    value={selectedClassFilter} 
                                    onChange={e => setSelectedClassFilter(e.target.value)}
                                    className="px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-darkcard text-sm font-medium outline-none"
                                >
                                    <option value="ALL">-- Semua Kelas --</option>
                                    {data.classes.map(c => (<option key={c.id} value={c.id}>Kelas {c.name}</option>))}
                                </select>

                                <input 
                                    type="text" 
                                    placeholder="Cari NIS atau Nama..." 
                                    value={searchTerm} 
                                    onChange={e => setSearchTerm(e.target.value)}
                                    className="px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-darkcard text-sm outline-none"
                                />
                            </div>
                        </div>
                    </Card>

                    <Card className="!p-0 overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse text-sm">
                                <thead>
                                    <tr className="bg-slate-50 dark:bg-slate-800/50 text-slate-600 dark:text-slate-300 text-xs font-semibold uppercase border-b border-slate-200 dark:border-slate-800">
                                        <th className="py-3 px-4">No</th>
                                        <th className="py-3 px-4">NIS</th>
                                        <th className="py-3 px-4">Nama Siswa</th>
                                        <th className="py-3 px-4">L/P</th>
                                        <th className="py-3 px-4">Kelas</th>
                                        <th className="py-3 px-4 text-right">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                                    {filteredStudents.length > 0 ? (
                                        filteredStudents.map((s, idx) => (
                                            <tr key={s.id} className="hover:bg-slate-50/50 dark:hover:bg-slate-800/30">
                                                <td className="py-3 px-4 text-slate-400">{idx + 1}</td>
                                                <td className="py-3 px-4 font-mono">{s.nis}</td>
                                                <td className="py-3 px-4 font-semibold text-slate-800 dark:text-white">{s.name}</td>
                                                <td className="py-3 px-4">
                                                    <span className={`inline-block px-2 py-0.5 rounded text-xs font-bold ${s.gender === 'L' ? 'bg-blue-100 text-blue-700' : 'bg-pink-100 text-pink-700'}`}>{s.gender}</span>
                                                </td>
                                                <td className="py-3 px-4">{s.className}</td>
                                                <td className="py-3 px-4 text-right">
                                                    <button onClick={() => { setStudentForm(s); setShowAddModal(true); }} className="p-1 text-slate-500 hover:text-gold-600"><i className="ph ph-pencil-simple text-lg"></i></button>
                                                    <button onClick={() => handleDeleteStudent(s.id, s.name)} className="p-1 text-slate-500 hover:text-red-600"><i className="ph ph-trash text-lg"></i></button>
                                                </td>
                                            </tr>
                                        ))
                                    ) : (
                                        <tr><td colSpan="6" className="py-8 text-center text-slate-400">Belum ada data siswa.</td></tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </Card>

                    {showImportModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fade-in">
                            <div className="bg-white dark:bg-darkcard rounded-2xl p-6 max-w-2xl w-full shadow-2xl border border-slate-200 dark:border-slate-800 max-h-[90vh] flex flex-col">
                                <h3 className="font-bold text-lg text-slate-800 dark:text-white mb-2">Pratinjau Impor Excel ({importPreview.length} Siswa)</h3>
                                <div className="overflow-y-auto flex-1 border rounded-xl mb-4 p-2">
                                    <table className="w-full text-xs">
                                        <thead>
                                            <tr className="bg-slate-100 dark:bg-slate-800"><th className="p-2">NIS</th><th className="p-2">Nama</th><th className="p-2">L/P</th><th className="p-2">Kelas</th></tr>
                                        </thead>
                                        <tbody>
                                            {importPreview.map((st, i) => (
                                                <tr key={i} className="border-b"><td className="p-2 font-mono">{st.nis}</td><td className="p-2 font-medium">{st.name}</td><td className="p-2">{st.gender}</td><td className="p-2">{st.rawClassName || st.className}</td></tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                                <div className="flex justify-end gap-3">
                                    <Button variant="ghost" onClick={() => setShowImportModal(false)}>Batal</Button>
                                    <Button variant="emerald" icon="ph-check-circle" onClick={handleConfirmImport}>Proses Simpan</Button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showAddModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fade-in">
                            <div className="bg-white dark:bg-darkcard rounded-2xl p-6 max-w-md w-full shadow-2xl border border-slate-200 dark:border-slate-800">
                                <h3 className="font-bold text-lg text-slate-800 dark:text-white mb-4">{studentForm.id ? 'Edit Siswa' : 'Tambah Siswa Manual'}</h3>
                                <form onSubmit={handleSaveStudent} className="space-y-3">
                                    <Input label="NIS" value={studentForm.nis} onChange={e => setStudentForm({...studentForm, nis: e.target.value})} required />
                                    <Input label="Nama Siswa" value={studentForm.name} onChange={e => setStudentForm({...studentForm, name: e.target.value})} required />
                                    <Select label="Jenis Kelamin" value={studentForm.gender} onChange={e => setStudentForm({...studentForm, gender: e.target.value})} options={[{value:'L', label:'Laki-Laki'}, {value:'P', label:'Perempuan'}]} />
                                    <Select label="Kelas" value={studentForm.classId} onChange={e => setStudentForm({...studentForm, classId: e.target.value})} options={data.classes.map(c => ({ value: c.id, label: `Kelas ${c.name}` }))} />
                                    <div className="flex justify-end gap-2 pt-2">
                                        <Button variant="ghost" onClick={() => setShowAddModal(false)}>Batal</Button>
                                        <Button type="submit">Simpan</Button>
                                    </div>
                                </form>

                    )}

                DB.saveClass({

                    name: classForm.name.trim()
                });

                setShowClassModal(false);
                setClassForm({ id: '', name: '' });
                showToast("Data kelas berhasil disimpan!");

                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5">

                                <Card key={c.id} className="relative overflow-hidden hover:border-gold-500 transition-all flex flex-col justify-between">

                    {showClassModal && (

        };

        const ViewPresensi = () => {
            const { data, refreshData, showToast } = useContext(AppContext);
            const [activeTab, setActiveTab] = useState('input');
            
            const [selectedClass, setSelectedClass] = useState(data.classes[0]?.id || '');
            const [selectedSubject, setSelectedSubject] = useState(data.subjects[0] || '');
            const [attendanceDate, setAttendanceDate] = useState(new Date().toISOString().split('T')[0]);
            const [records, setRecords] = useState({});

            const [rekapClass, setRekapClass] = useState(data.classes[0]?.id || '');
            const [rekapSubject, setRekapSubject] = useState('ALL');
            const [rekapMonth, setRekapMonth] = useState(new Date().toISOString().substr(0, 7));

            const classStudents = useMemo(() => {
                return data.students.filter(s => s.classId === selectedClass);
            }, [data.students, selectedClass]);

            const rekapClassStudents = useMemo(() => {
                return data.students.filter(s => s.classId === rekapClass);
            }, [data.students, rekapClass]);

            useEffect(() => {
                const found = data.attendance.find(a => 
                    a.date === attendanceDate && 
                    a.classId === selectedClass && 
                    (a.subject === selectedSubject || (!a.subject && !selectedSubject))
                );
                if (found) {
                    setRecords(found.records);
                } else {
                    const defaultRec = {};
                    classStudents.forEach(s => { defaultRec[s.id] = 'H'; });
                    setRecords(defaultRec);
                }
            }, [selectedClass, selectedSubject, attendanceDate, data.attendance, classStudents]);

            const handleStatusChange = (studentId, status) => {
                setRecords(prev => ({ ...prev, [studentId]: status }));
            };

            const markAllHadir = () => {
                const updated = {};
                classStudents.forEach(s => { updated[s.id] = 'H'; });
                setRecords(updated);
                showToast("Seluruh siswa ditandai HADIR.");
            };

            const handleSaveAttendance = () => {
                DB.saveAttendance(attendanceDate, selectedClass, selectedSubject, records);
                refreshData();
                showToast("Presensi harian siswa berhasil disimpan!");
            };

            const dailySummary = useMemo(() => {
                let H = 0, S = 0, I = 0, A = 0;
                Object.values(records).forEach(status => {
                    if (status === 'H') H++;
                    if (status === 'S') S++;
                    if (status === 'I') I++;
                    if (status === 'A') A++;
                });
                return { H, S, I, A };
            }, [records]);

            const rekapData = useMemo(() => {
                const filteredAttendance = data.attendance.filter(a => {
                    const matchClass = a.classId === rekapClass;
                    const matchMonth = a.date.startsWith(rekapMonth);
                    const matchSubject = rekapSubject === 'ALL' || a.subject === rekapSubject;
                    return matchClass && matchMonth && matchSubject;
                });

                const totalDays = filteredAttendance.length;

                const result = rekapClassStudents.map(s => {
                    let H = 0, S = 0, I = 0, A = 0;
                    filteredAttendance.forEach(att => {
                        const status = att.records[s.id] || 'H';
                        if (status === 'H') H++;
                        if (status === 'S') S++;
                        if (status === 'I') I++;
                        if (status === 'A') A++;
                    });
                    const pct = totalDays > 0 ? Math.round((H / totalDays) * 100) : 100;
                    return { ...s, H, S, I, A, totalDays, pct };
                });

                return { list: result, totalDays };
            }, [data.attendance, rekapClass, rekapSubject, rekapMonth, rekapClassStudents]);

            const exportRekapExcel = () => {
                const className = data.classes.find(c => c.id === rekapClass)?.name || '';
                const excelRows = rekapData.list.map((s, idx) => ({
                    "No": idx + 1,
                    "NIS": s.nis,
                    "Nama Siswa": s.name,
                    "L/P": s.gender,
                    "Hadir (H)": s.H,
                    "Sakit (S)": s.S,
                    "Izin (I)": s.I,
                    "Alpa (A)": s.A,
                    "Persentase Kehadiran (%)": `${s.pct}%`
                }));

                const worksheet = XLSX.utils.json_to_sheet(excelRows);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, `Rekap_Presensi_${className}`);
                XLSX.writeFile(workbook, `Rekap_Presensi_Kelas_${className}_${rekapMonth}.xlsx`);
                showToast("Rekapitulasi Presensi berhasil diexport ke Excel!");
            };

            const exportRekapPDF = () => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF('p', 'mm', 'a4');

                const kop = data.kopSettings;
                const teacher = data.teacher;
                const className = data.classes.find(c => c.id === rekapClass)?.name || '';

                if (kop.logoLeft) {
                    try { doc.addImage(kop.logoLeft, 'PNG', 12, 10, kop.logoSize || 20, kop.logoSize || 20); } catch(e){}
                }
                if (kop.logoRight) {
                    try { doc.addImage(kop.logoRight, 'PNG', 178, 10, kop.logoSize || 20, kop.logoSize || 20); } catch(e){}
                }

                doc.setFont("helvetica", "bold");
                doc.setFontSize(11);
                doc.text(kop.line1 || "", 105, 15, { align: "center" });
                doc.setFontSize(12);
                doc.text(kop.line2 || "", 105, 21, { align: "center" });
                doc.setFontSize(13);
                doc.text(kop.line3 || "", 105, 27, { align: "center" });
                
                doc.setFont("helvetica", "normal");
                doc.setFontSize(8);
                doc.text(kop.address || "", 105, 32, { align: "center" });
                doc.text(kop.contact || "", 105, 36, { align: "center" });

                doc.setLineWidth(0.8);
                doc.line(12, 39, 198, 39);
                doc.setLineWidth(0.2);
                doc.line(12, 40, 198, 40);

                doc.setFont("helvetica", "bold");
                doc.setFontSize(12);
                doc.text(`REKAPITULASI PRESENSI KEHADIRAN SISWA`, 105, 48, { align: "center" });

                doc.setFontSize(9);
                doc.setFont("helvetica", "normal");
                doc.text(`Kelas               : Kelas ${className}`, 12, 56);
                doc.text(`Mata Pelajaran : ${rekapSubject === 'ALL' ? 'Semua Mata Pelajaran' : rekapSubject}`, 12, 61);
                doc.text(`Bulan / Tahun  : ${rekapMonth}`, 135, 56);
                doc.text(`Guru Pengampu : ${teacher.name}`, 135, 61);

                const tableBody = rekapData.list.map((s, i) => [
                    i + 1,
                    s.nis,
                    s.name,
                    s.gender,
                    s.H,
                    s.S,
                    s.I,
                    s.A,
                    `${s.pct}%`
                ]);

                doc.autoTable({
                    startY: 67,
                    head: [['No', 'NIS', 'Nama Siswa', 'L/P', 'H', 'S', 'I', 'A', '% Hadir']],
                    body: tableBody,
                    styles: { fontSize: 8, cellPadding: 2.5 },
                    headStyles: { fillColor: [16, 185, 129], textColor: 255, fontStyle: 'bold', halign: 'center' },
                    columnStyles: {
                        0: { cellWidth: 10, halign: 'center' },
                        1: { cellWidth: 25, halign: 'center' },
                        2: { cellWidth: 'auto' },
                        3: { cellWidth: 12, halign: 'center' },
                        4: { cellWidth: 12, halign: 'center' },
                        5: { cellWidth: 12, halign: 'center' },
                        6: { cellWidth: 12, halign: 'center' },
                        7: { cellWidth: 12, halign: 'center' },
                        8: { cellWidth: 20, halign: 'center' }
                    }
                });

                const finalY = doc.lastAutoTable.finalY + 15;
                if (finalY < 250) {
                    doc.text(`Gorontalo, ${formatDate(new Date().toISOString())}`, 135, finalY);
                    doc.text("Mengetahui,", 12, finalY + 5);
                    doc.text("Kepala Madrasah / Sekolah", 12, finalY + 10);
                    doc.text("Guru Mata Pelajaran / Kelas", 135, finalY + 10);

                    doc.setFont("helvetica", "bold");
                    doc.text(teacher.headmasterName || "Kepala Sekolah", 12, finalY + 30);
                    doc.setFont("helvetica", "normal");
                    doc.text(`NIP. ${teacher.headmasterNip || '-'}`, 12, finalY + 34);

                    doc.setFont("helvetica", "bold");
                    doc.text(teacher.name, 135, finalY + 30);
                    doc.setFont("helvetica", "normal");
                    doc.text(`NIP. ${teacher.nip}`, 135, finalY + 34);
                }

                doc.save(`Rekap_Presensi_Kelas_${className}_${rekapMonth}.pdf`);
                showToast("Rekapitulasi Presensi PDF berhasil dicetak!");
            };

            return (
                <div className="animate-fade-in space-y-6">
                    <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div>
                            <h2 className="text-2xl font-bold font-display text-slate-800 dark:text-white flex items-center gap-2">
                                <i className="ph ph-checks text-emerald-600"></i>
                                Presensi Murid & Rekapitulasi
                            </h2>
                            <p className="text-sm text-slate-500">Catat presensi per mata pelajaran serta ekspor rekapitulasi ke Excel & PDF.</p>
                        </div>

                        <div className="flex p-1 bg-slate-100 dark:bg-slate-800 rounded-xl">
                            <button 
                                onClick={() => setActiveTab('input')} 
                                className={`px-4 py-2 rounded-lg text-xs font-bold transition-all ${activeTab === 'input' ? 'bg-white dark:bg-darkcard text-gold-600 shadow-sm' : 'text-slate-500'}`}
                            >
                                <i className="ph ph-pencil-simple mr-1"></i> Input Harian
                            </button>
                            <button 
                                onClick={() => setActiveTab('rekap')} 
                                className={`px-4 py-2 rounded-lg text-xs font-bold transition-all ${activeTab === 'rekap' ? 'bg-white dark:bg-darkcard text-emerald-600 shadow-sm' : 'text-slate-500'}`}
                            >
                                <i className="ph ph-chart-bar mr-1"></i> Rekap & Export
                            </button>
                        </div>
                    </div>

                    {activeTab === 'input' ? (
                        <>
                            <Card className="!p-4">
                                <div className="grid grid-cols-1 md:grid-cols-4 gap-4 items-center">

                                        <label className="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Tanggal Presensi</label>

                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Pilih Kelas</label>
                                        <select 
                                            value={selectedClass} 
                                            onChange={e => setSelectedClass(e.target.value)}
                                            className="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-darkcard text-sm font-medium outline-none"
                                        >
                                            {data.classes.map(c => (
                                                <option key={c.id} value={c.id}>Kelas {c.name}</option>

                                        <label className="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Mata Pelajaran</label>

                                                <option key={idx} value={subj}>{subj}</option>

                                    <div className="flex justify-end gap-2 pt-4 md:pt-0">

                                            Semua Hadir

                                        <Button variant="emerald" icon="ph-floppy-disk" onClick={handleSaveAttendance}>
                                            Simpan Presensi

                                    </div>
                                </div>
                            </Card>

                            <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                                <div className="p-3 rounded-xl bg-emerald-50 dark:bg-emerald-900/20 border border-emerald-200 dark:border-emerald-800 text-emerald-800 dark:text-emerald-300 text-center">
                                    <span className="text-xs uppercase font-bold tracking-wider block">Hadir (H)</span>
                                    <span className="text-2xl font-black">{dailySummary.H}</span>
                                </div>
                                <div className="p-3 rounded-xl bg-blue-50 dark:bg-blue-900/20 border border-blue-200 dark:border-blue-800 text-blue-800 dark:text-blue-300 text-center">
                                    <span className="text-xs uppercase font-bold tracking-wider block">Sakit (S)</span>
                                    <span className="text-2xl font-black">{dailySummary.S}</span>

                                    <span className="text-xs uppercase font-bold tracking-wider block">Izin (I)</span>
                                    <span className="text-2xl font-black">{dailySummary.I}</span>
                                </div>
                                <div className="p-3 rounded-xl bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 text-red-800 dark:text-red-300 text-center">
                                    <span className="text-xs uppercase font-bold tracking-wider block">Alpa (A)</span>
                                    <span className="text-2xl font-black">{dailySummary.A}</span>
                                </div>
                            </div>

                            <Card className="!p-0 overflow-hidden">
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left border-collapse text-sm">
                                        <thead>
                                            <tr className="bg-slate-50 dark:bg-slate-800/50 text-slate-600 dark:text-slate-300 text-xs font-semibold uppercase border-b border-slate-200 dark:border-slate-800">
                                                <th className="py-3 px-4">No</th>
                                                <th className="py-3 px-4">NIS</th>
                                                <th className="py-3 px-4">Nama Siswa</th>
                                                <th className="py-3 px-4">L/P</th>
                                                <th className="py-3 px-4 text-center">Status Kehadiran</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                                            {classStudents.length > 0 ? (
                                                classStudents.map((s, idx) => {
                                                    const status = records[s.id] || 'H';
                                                    return (
                                                        <tr key={s.id} className="hover:bg-slate-50/50 dark:hover:bg-slate-800/30">
                                                            <td className="py-3 px-4 text-slate-400">{idx + 1}</td>
                                                            <td className="py-3 px-4 font-mono">{s.nis}</td>
                                                            <td className="py-3 px-4 font-semibold text-slate-800 dark:text-white">{s.name}</td>
                                                            <td className="py-3 px-4">{s.gender}</td>
                                                            <td className="py-3 px-4">
                                                                <div className="flex justify-center items-center gap-1 sm:gap-2">
                                                                    {[
                                                                        { code: 'H', label: 'Hadir', bg: 'bg-emerald-500 text-white' },
                                                                        { code: 'S', label: 'Sakit', bg: 'bg-blue-500 text-white' },
                                                                        { code: 'I', label: 'Izin', bg: 'bg-amber-500 text-white' },
                                                                        { code: 'A', label: 'Alpa', bg: 'bg-red-500 text-white' },
                                                                    ].map(item => (
                                                                        <button
                                                                            key={item.code}
                                                                            type="button"
                                                                            onClick={() => handleStatusChange(s.id, item.code)}
                                                                            className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${
                                                                                status === item.code 
                                                                                    ? `${item.bg} shadow-md scale-105` 
                                                                                    : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:bg-slate-200'
                                                                            }`}
                                                                        >
                                                                            {item.code}
                                                                        </button>
                                                                    ))}
                                                                </div>
                                                            </td>
                                                        </tr>
                                                    );
                                                })
                                            ) : (
                                                <tr>
                                                    <td colSpan="5" className="py-8 text-center text-slate-400">
                                                        Tidak ada data siswa untuk kelas ini. Silakan kelola di menu <b>Data Siswa</b>.
                                                    </td>
                                                </tr>
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </Card>
                        </>
                    ) : (
                        <>
                            <Card className="!p-4">
                                <div className="grid grid-cols-1 md:grid-cols-4 gap-4 items-center">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Pilih Bulan & Tahun</label>
                                        <input 
                                            type="month" 
                                            value={rekapMonth} 
                                            onChange={e => setRekapMonth(e.target.value)}
                                            className="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-darkcard text-sm font-medium outline-none"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Pilih Kelas</label>
                                        <select 
                                            value={rekapClass} 
                                            onChange={e => setRekapClass(e.target.value)}
                                            className="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-darkcard text-sm font-medium outline-none"
                                        >
                                            {data.classes.map(c => (

                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Mata Pelajaran</label>
                                        <select 
                                            value={rekapSubject} 
                                            onChange={e => setRekapSubject(e.target.value)}
                                            className="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-darkcard text-sm font-medium outline-none"
                                        >
